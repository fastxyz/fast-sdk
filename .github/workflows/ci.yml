name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Diff check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Fast ID SDK typecheck
        run: pnpm --filter @fastxyz/fastid-sdk typecheck

      - name: Fast ID SDK tarball consumer
        run: pnpm --filter @fastxyz/fastid-sdk smoke:package

      - name: Fast Sign SDK typecheck and license audit
        run: pnpm --filter @fastxyz/sign-sdk typecheck && pnpm --filter @fastxyz/sign-sdk audit:licenses

      - name: Fast Sign SDK build
        run: pnpm --filter @fastxyz/sign-sdk build

      - name: Fast Sign SDK tests
        run: pnpm --filter @fastxyz/sign-sdk test

      - name: Fast Sign SDK tarball consumer
        run: pnpm --filter @fastxyz/sign-sdk smoke:package
